# Poltergeist Example Configuration

# The base URL identifying this OIDC provider.
# This URL will be used as the 'iss' (issuer) claim in tokens.
issuer: "http://poltergeist:8080"

# The context path that prefixes all endpoints (e.g., "/oidc").
# If set to "/oidc", the token endpoint will be at "/oidc/token".
context_path: ""

# Port number the server will listen on.
port: 8080

# URL to the upstream OIDC provider's JWKS endpoint.
# Required if 'validate_upstream_token' is set to true.
upstream_jwks_url: "http://upstream-idp/.well-known/jwks.json"

# Whether to strictly validate the signature of the upstream token.
# If false (default), the token is decoded without signature verification.
validate_upstream_token: false

# Path to the RSA private key (PEM format) used for signing downstream tokens.
signing_key_path: "/etc/poltergeist/private_key.pem"

# Default token expiration time in seconds (default: 3600).
token_expires_in: 3600

# Optional: Custom endpoint paths.
# These allow you to change the default OIDC paths.
# For example, setting authorize to "/login" would change the endpoint from /authorize to /login.
endpoints:
  authorize: "/authorize"
  # Path for the token endpoint.
  token: "/token"
  # Path for the JWKS endpoint.
  jwks: "/jwks"
  # Path for the UserInfo endpoint.
  userinfo: "/userinfo"
  # Path for the OIDC Discovery endpoint.
  well_known: "/.well-known/openid-configuration"

# Static Confidential Clients (for Service-to-Service M2M client_credentials flow).
confidential_clients:
  - client_id: "example-m2m"
    # The client secret can be provided directly:
    client_secret: "example-secret"
    # Or read from an environment variable:
    # client_secret_env: "M2M_CLIENT_SECRET"
    audience: "example-audience"

# Static Public Clients (for Browser-based authorization_code flow).
public_clients:
  - client_id: "example-app"
    audience: "example-api"

# Secondary well-known configurations.
# Useful for internal vs external discovery.
secondary_well_known:
  - path: "/.well-known/openid-configuration-external"
    authorization_host: "https://auth-ext.example.com"
    token_host: "https://auth-ext.example.com"
    jwks_host: "https://auth-ext.example.com"
    userinfo_host: "https://auth-ext.example.com"

# Telemetry and Logging configuration.
telemetry:
  # Output format: "json" (default) or "pretty".
  format: "pretty"
  # Global log level: "trace", "debug", "info", "warn", "error".
  level: "info"
  # Specific log level for the Axum framework.
  axum_level: "warn"
  service_name: "poltergeist-example"